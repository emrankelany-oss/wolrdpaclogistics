name: Schedule Engine — Sync & Publish

on:
  schedule:
    # Runs daily at 22:15 UTC (1:15 AM Asia/Beirut)
    - cron: '35 22 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can push back
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync (discover new articles)
        run: node schedule-engine/schedule-engine/sync.js "${{ github.workspace }}"

      - name: Run publish (mark due articles as published)
        run: node schedule-engine/schedule-engine/publish.js "${{ github.workspace }}"

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && git diff --cached --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "schedule-engine[bot]"
          git config user.email "schedule-engine[bot]@users.noreply.github.com"
          git add schedule.config.json schedule.registry.json
          git commit -m "chore(schedule-engine): sync and publish articles [skip ci]"
          git push
